<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>✨ Mini Calculator ✨</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Starry background -->
  <div class="stars-bg" aria-hidden="true">
    <span class="star">✨</span>
    <span class="star">⭐</span>
    <span class="star">✨</span>
    <span class="star">🌟</span>
    <span class="star">✨</span>
    <span class="star">⭐</span>
    <span class="star">✨</span>
    <span class="star">🌟</span>
    <span class="star">✨</span>
    <span class="star">⭐</span>
  </div>

  <main class="calculator" role="application" aria-label="Mini Calculator">
    <!-- Header -->
    <header class="calc-header">
      <h1 class="title">
        <span class="spark">✨</span>
        MINI CALCULATOR
        <span class="spark">✨</span>
      </h1>
    </header>

    <!-- Display -->
    <section class="display" aria-live="polite">
      <div class="expression" id="expression">0</div>
      <div class="separator"></div>
      <div class="result" id="result">0</div>
    </section>

    <!-- Buttons grid -->
    <section class="keypad" role="group" aria-label="Calculator keys">
      <button class="btn num" data-action="num" data-value="7">7️⃣</button>
      <button class="btn num" data-action="num" data-value="8">8️⃣</button>
      <button class="btn num" data-action="num" data-value="9">9️⃣</button>
      <button class="btn op" data-action="op" data-value="/">➗</button>

      <button class="btn num" data-action="num" data-value="4">4️⃣</button>
      <button class="btn num" data-action="num" data-value="5">5️⃣</button>
      <button class="btn num" data-action="num" data-value="6">6️⃣</button>
      <button class="btn op" data-action="op" data-value="*">✖️</button>

      <button class="btn num" data-action="num" data-value="1">1️⃣</button>
      <button class="btn num" data-action="num" data-value="2">2️⃣</button>
      <button class="btn num" data-action="num" data-value="3">3️⃣</button>
      <button class="btn op" data-action="op" data-value="-">➖</button>

      <button class="btn num" data-action="num" data-value="0">0️⃣</button>
      <button class="btn num" data-action="dot">.️⃣</button>
      <button class="btn eq" data-action="equals">🟰</button>
      <button class="btn op" data-action="op" data-value="+">➕</button>

      <button class="btn clear" data-action="clear">🔄</button>
      <button class="btn back" data-action="backspace">⌫</button>
    </section>

    <footer class="calc-footer">
      <span>✨ ⭐ ✨</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
