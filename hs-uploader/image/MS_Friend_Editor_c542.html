<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS Friend Editor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0b0b0f;color:white;height:100vh}
header{height:60px;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between;padding:0 25px}
.publish{background:#2563eb;color:white;padding:10px 22px;border-radius:8px;border:0}
.container{display:grid;grid-template-columns:250px 1fr 250px;height:calc(100vh - 110px)}
.sidebar,.properties{padding:20px;border-color:#333}
.sidebar{border-right:1px solid #333}
.properties{border-left:1px solid #333}
.component{width:100%;background:#1f1f25;color:white;padding:12px;margin:8px 0;border:0;border-radius:8px}
.upload{display:block;background:#2563eb;padding:12px;border-radius:8px;margin-top:15px;cursor:pointer}
input{display:none}
.preview{padding:30px}
.website{background:white;color:black;min-height:500px;border-radius:15px;padding:40px}
.website h1{font-size:40px}
.website p{margin-top:15px}
video{width:100%;margin-top:25px;border-radius:10px}
.music-btn{background:black;color:white;padding:12px 20px;margin-top:15px;border:0;border-radius:8px}
.box{background:#18181b;padding:20px;border-radius:10px;margin-top:20px}
footer{height:50px;border-top:1px solid #333;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<header>
<h1>MS Friend Editor</h1>
<button class="publish">Publish</button>
</header>

<div class="container">

<div class="sidebar">
<h2>Components</h2>
<button class="component">Text</button>
<button class="component">Image</button>
<button class="component">Button</button>
<button class="component">Section</button>

<h2 style="margin-top:30px">Music Player</h2>
<label class="upload">
Upload Video Music
<input type="file" id="videoUpload" accept="video/*">
</label>
</div>

<div class="preview">
<div class="website">
<h1>Build Your Website</h1>
<p>Edit your website visually with MS Friend Editor.</p>

<video id="videoPlayer" controls style="display:none"></video>

<button class="music-btn" onclick="toggleMusic()">
Play / Pause Music
</button>
</div>
</div>

<div class="properties">
<h2>Properties</h2>
<div class="box">Select an element to edit</div>
</div>

</div>

<footer>
Generated by Malik Mushahid
</footer>

<script>
let video=document.getElementById("videoPlayer");

document.getElementById("videoUpload").addEventListener("change",function(e){
let file=e.target.files[0];
if(file){
video.src=URL.createObjectURL(file);
video.style.display="block";
}
});

function toggleMusic(){
if(video.paused){
video.play();
}else{
video.pause();
}
}
</script>

</body>
</html>
