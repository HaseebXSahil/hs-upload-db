<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>My Music Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.player {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #111;
}

/* Background */
.background {
    position: absolute;
    inset: 0;
    background-image: url("background.jpg");
    background-size: cover;
    background-position: center;
    filter: blur(2px);
    transform: scale(1.05);
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.65),
            rgba(0,0,0,.25),
            rgba(0,0,0,.85)
        );
}

/* Main content */
.content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* Header */
.header {
    padding: 25px 18px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-size: 22px;
    font-weight: bold;
}

.header button {
    border: none;
    background: rgba(255,255,255,.12);
    color: white;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 20px;
}

/* Song list */
.song-list {
    padding: 5px 15px;
    overflow-y: auto;
    flex: 1;
}

.song {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    margin-bottom: 5px;
    border-radius: 12px;
    background: rgba(0,0,0,.25);
}

.song.active {
    background: rgba(255,255,255,.18);
}

.song img {
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 8px;
}

.song-info {
    flex: 1;
    overflow: hidden;
}

.song-name {
    font-size: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-meta {
    color: #bbb;
    font-size: 12px;
    margin-top: 5px;
}

.song button {
    background: none;
    border: none;
    color: white;
    font-size: 20px;
}

/* Bottom player */
.bottom {
    padding: 10px 20px 25px;
    background: linear-gradient(
        transparent,
        rgba(0,0,0,.8) 25%
    );
}

.now-playing {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.cover {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    object-fit: cover;
}

.now-info {
    flex: 1;
}

.now-name {
    font-size: 17px;
    font-weight: bold;
}

.now-artist {
    color: #bbb;
    font-size: 13px;
    margin-top: 4px;
}

.like {
    background: none;
    border: none;
    color: white;
    font-size: 27px;
}

/* Progress */
.progress-container {
    width: 100%;
}

.progress {
    width: 100%;
    height: 4px;
    accent-color: white;
}

.time {
    display: flex;
    justify-content: space-between;
    color: #aaa;
    font-size: 11px;
    margin-top: 4px;
}

/* Controls */
.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    margin-top: 12px;
}

.controls button {
    border: none;
    background: none;
    color: white;
    font-size: 25px;
}

.play {
    width: 64px !important;
    height: 64px;
    border-radius: 50%;
    background: white !important;
    color: black !important;
    font-size: 28px !important;
}

/* Import buttons */
.import-area {
    padding: 5px 15px 10px;
    display: flex;
    gap: 8px;
}

.import-btn {
    flex: 1;
    border: none;
    padding: 13px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
    color: white;
    font-size: 14px;
}

input[type="file"] {
    display: none;
}
</style>
</head>

<body>

<div class="player">

    <div class="background" id="background"></div>

    <div class="content">

        <!-- Header -->
        <div class="header">
            <div class="title">My Music</div>

            <button onclick="openBackground()">
                🖼️
            </button>
        </div>

        <!-- Songs -->
        <div class="song-list" id="songList">
            <div style="text-align:center;color:#aaa;margin-top:50px;">
                No songs imported
            </div>
        </div>

        <!-- Import buttons -->
        <div class="import-area">

            <button class="import-btn"
                    onclick="openSongs()">
                🎵 Import Songs
            </button>

            <button class="import-btn"
                    onclick="openBackground()">
                🖼️ Background
            </button>

        </div>

        <!-- Bottom Player -->
        <div class="bottom">

            <div class="now-playing">

                <img
                    id="cover"
                    class="cover"
                    src="background.jpg"
                >

                <div class="now-info">

                    <div id="nowName"
                         class="now-name">
                        Select a song
                    </div>

                    <div class="now-artist">
                        My Music
                    </div>

                </div>

                <button
                    class="like"
                    onclick="toggleLike()"
                    id="likeBtn">
                    ♡
                </button>

            </div>

            <!-- Progress -->
            <div class="progress-container">

                <input
                    id="progress"
                    class="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                    oninput="seekMusic()">

                <div class="time">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>

            </div>

            <!-- Controls -->
            <div class="controls">

                <button onclick="toggleShuffle()">
                    🔀
                </button>

                <button onclick="previousSong()">
                    ⏮
                </button>

                <button
                    id="playBtn"
                    class="play"
                    onclick="togglePlay()">
                    ▶
                </button>

                <button onclick="nextSong()">
                    ⏭
                </button>

                <button onclick="toggleRepeat()">
                    🔁
                </button>

            </div>

        </div>

    </div>

</div>


<!-- Hidden file inputs -->

<input
    id="songInput"
    type="file"
    accept="audio/*"
    multiple
>

<input
    id="backgroundInput"
    type="file"
    accept="image/*"
>


<script>

let songs = [];
let currentSong = 0;

let audio = new Audio();

let shuffle = false;
let repeat = false;
let liked = false;


/* -------------------------
   IMPORT SONGS
------------------------- */

function openSongs() {
    document.getElementById("songInput").click();
}

document.getElementById("songInput")
.addEventListener("change", function(e) {

    const files = Array.from(e.target.files);

    files.forEach(file => {

        songs.push({
            name: file.name.replace(/\.[^/.]+$/, ""),
            file: URL.createObjectURL(file),
            cover: document.getElementById("background")
                         .style.backgroundImage
                         .replace(/^url\(["']?/, "")
                         .replace(/["']?\)$/, "")
        });

    });

    renderSongs();

    if (songs.length === files.length) {
        loadSong(0);
    }

});


/* -------------------------
   SHOW SONG LIST
------------------------- */

function renderSongs() {

    const list =
        document.getElementById("songList");

    list.innerHTML = "";

    songs.forEach((song, index) => {

        const div =
            document.createElement("div");

        div.className =
            "song " +
            (index === currentSong ? "active" : "");

        div.innerHTML = `

            <img src="${getCover()}">

            <div class="song-info">

                <div class="song-name">
                    ${escapeHTML(song.name)}
                </div>

                <div class="song-meta">
                    Local Song
                </div>

            </div>

            <button onclick="playSong(${index})">
                ▶
            </button>
        `;

        list.appendChild(div);

    });

}


/* -------------------------
   LOAD SONG
------------------------- */

function loadSong(index) {

    if (!songs.length) return;

    currentSong = index;

    audio.src = songs[index].file;

    document.getElementById("nowName")
        .innerText = songs[index].name;

    document.getElementById("cover")
        .src = getCover();

    renderSongs();

}


/* -------------------------
   PLAY SONG
------------------------- */

function playSong(index) {

    loadSong(index);

    audio.play();

    document.getElementById("playBtn")
        .innerText = "❚❚";
}


function togglePlay() {

    if (!songs.length) {

        openSongs();
        return;

    }

    if (audio.paused) {

        audio.play();

        document.getElementById("playBtn")
            .innerText = "❚❚";

    } else {

        audio.pause();

        document.getElementById("playBtn")
            .innerText = "▶";

    }

}


/* -------------------------
   NEXT
------------------------- */

function nextSong() {

    if (!songs.length) return;

    if (shuffle) {

        currentSong =
            Math.floor(Math.random() * songs.length);

    } else {

        currentSong++;

        if (currentSong >= songs.length) {
            currentSong = 0;
        }

    }

    loadSong(currentSong);

    audio.play();

    document.getElementById("playBtn")
        .innerText = "❚❚";
}


/* -------------------------
   PREVIOUS
------------------------- */

function previousSong() {

    if (!songs.length) return;

    currentSong--;

    if (currentSong < 0) {
        currentSong = songs.length - 1;
    }

    loadSong(currentSong);

    audio.play();

    document.getElementById("playBtn")
        .innerText = "❚❚";
}


/* -------------------------
   AUTO NEXT
------------------------- */

audio.addEventListener("ended", function() {

    if (repeat) {

        audio.currentTime = 0;
        audio.play();

    } else {

        nextSong();

    }

});


/* -------------------------
   PROGRESS
------------------------- */

audio.addEventListener("timeupdate", function() {

    if (!audio.duration) return;

    const percent =
        (audio.currentTime / audio.duration) * 100;

    document.getElementById("progress")
        .value = percent;

    document.getElementById("currentTime")
        .innerText =
        formatTime(audio.currentTime);

    document.getElementById("duration")
        .innerText =
        formatTime(audio.duration);

});


function seekMusic() {

    if (!audio.duration) return;

    const percent =
        document.getElementById("progress").value;

    audio.currentTime =
        (percent / 100) * audio.duration;

}


/* -------------------------
   FORMAT TIME
------------------------- */

function formatTime(seconds) {

    if (!seconds || isNaN(seconds))
        return "0:00";

    const min =
        Math.floor(seconds / 60);

    const sec =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return min + ":" + sec;

}


/* -------------------------
   BACKGROUND IMAGE
------------------------- */

function openBackground() {

    document.getElementById("backgroundInput")
        .click();

}

document.getElementById("backgroundInput")
.addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    const url = URL.createObjectURL(file);

    document.getElementById("background")
        .style.backgroundImage =
        `url("${url}")`;

    document.getElementById("cover")
        .src = url;

    localStorage.setItem(
        "background",
        url
    );

});


/* -------------------------
   SHUFFLE
------------------------- */

function toggleShuffle() {

    shuffle = !shuffle;

    alert(
        shuffle
        ? "Shuffle ON"
        : "Shuffle OFF"
    );

}


/* -------------------------
   REPEAT
------------------------- */

function toggleRepeat() {

    repeat = !repeat;

    alert(
        repeat
        ? "Repeat ON"
        : "Repeat OFF"
    );

}


/* -------------------------
   LIKE
------------------------- */

function toggleLike() {

    liked = !liked;

    document.getElementById("likeBtn")
        .innerText =
        liked ? "♥" : "♡";

}


/* -------------------------
   COVER
------------------------- */

function getCover() {

    const bg =
        document.getElementById("background")
        .style.backgroundImage;

    if (bg) {

        return bg
            .replace(/^url\(["']?/, "")
            .replace(/["']?\)$/, "");

    }

    return "background.jpg";

}


/* -------------------------
   SECURITY
------------------------- */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>
</html>
