<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forever Friendship - Luxury Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:wght@700&family=Montserrat:wght@500;700&display=swap');

*{box-sizing:border-box}
body{
margin:0;
background:#080b16;
color:#fff;
font-family:Montserrat,sans-serif;
overflow-x:hidden;
}

body:before{
content:"";
position:fixed;
inset:0;
background:radial-gradient(circle,#26335c,#080b16 65%);
z-index:-1;
}

.hero{
text-align:center;
padding:70px 20px;
}

h1{
font-family:"Playfair Display",serif;
font-size:75px;
letter-spacing:5px;
color:#f5d98b;
margin:0;
}

.subtitle{
font-family:Cinzel,serif;
font-size:24px;
letter-spacing:4px;
margin-top:20px;
}

.container{
display:flex;
justify-content:center;
gap:50px;
flex-wrap:wrap;
padding:40px;
}

.profile{
background:linear-gradient(145deg,#171d35,#0d1020);
padding:40px;
border-radius:20px;
width:360px;
text-align:center;
border:1px solid #c9a74d;
box-shadow:0 20px 50px #000;
animation:up 5s infinite;
}

@keyframes up{
50%{transform:translateY(-15px)}
}

.photo{
width:240px;
height:240px;
border-radius:50%;
object-fit:cover;
border:5px solid #d4af37;
}

.name{
font-family:"Playfair Display",serif;
font-size:42px;
color:#f5d98b;
margin-top:20px;
}

button{
background:#d4af37;
color:#111;
border:0;
padding:15px 30px;
border-radius:30px;
font-weight:bold;
margin:8px;
cursor:pointer;
}

button:hover{
transform:scale(1.08);
}

.panel,.surprise{
max-width:800px;
margin:40px auto;
padding:35px;
background:#11182d;
border-radius:25px;
border:1px solid #d4af37;
}

input,textarea{
width:85%;
padding:14px;
margin:8px;
border-radius:10px;
border:0;
}

.surprise{
display:none;
font-family:"Playfair Display",serif;
font-size:34px;
line-height:1.6;
color:#f5d98b;
min-height:150px;
}

.petal{
position:fixed;
top:-30px;
font-size:25px;
animation:fall 10s linear;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
}
}

.particle{
position:fixed;
width:4px;
height:4px;
background:#d4af37;
border-radius:50%;
animation:move 8s linear infinite;
}

@keyframes move{
from{transform:translateY(100vh)}
to{transform:translateY(-20vh)}
}
</style>
</head>
<body>

<section class="hero">
<h1>Forever Friendship</h1>
<div class="subtitle">A timeless story of trust and memories</div>
</section>

<div class="container">

<div class="profile">
<img id="pic1" class="photo" src="https://via.placeholder.com/240">
<div id="name1" class="name">Friend One</div>
</div>

<div class="profile">
<img id="pic2" class="photo" src="https://via.placeholder.com/240">
<div id="name2" class="name">Friend Two</div>
</div>

</div>

<center>
<button onclick="openSurprise()">Open Memory</button>
</center>

<div id="surprise" class="surprise"></div>

<div class="panel">
<h2>Friendship Admin</h2>

<input id="n1" placeholder="Friend 1 Name">
<button onclick="name1.innerHTML=n1.value">Update</button><br>

<input id="n2" placeholder="Friend 2 Name">
<button onclick="name2.innerHTML=n2.value">Update</button><br>

<input type="file" id="im1">
<button onclick="pic1.src=URL.createObjectURL(im1.files[0])">Change Picture 1</button><br>

<input type="file" id="im2">
<button onclick="pic2.src=URL.createObjectURL(im2.files[0])">Change Picture 2</button><br>

<input type="file" id="music" accept="audio/*">
<button onclick="audio.play()">Play Music</button>
<button onclick="audio.pause()">Pause Music</button>
<audio id="audio"></audio>

<br>
<textarea id="custom" placeholder="Surprise quotation"></textarea><br>

<button onclick="save()">Save Information</button>
<button onclick="share()">Generate Link</button>

<p id="link"></p>

</div>

<script>

music.onchange=()=>audio.src=URL.createObjectURL(music.files[0]);

function openSurprise(){
let text=custom.value||"A beautiful friendship is a rare treasure. It grows with trust, survives every distance, and becomes a lifetime of unforgettable memories.";
surprise.style.display="block";
surprise.innerHTML="";
let i=0;
let timer=setInterval(()=>{
surprise.innerHTML+=text[i++];
if(i>=text.length)clearInterval(timer);
},60);
}

function save(){
localStorage.friendship=JSON.stringify({
one:name1.innerHTML,
two:name2.innerHTML
});
alert("Saved Successfully");
}

function share(){
link.innerHTML=location.href+"?friend="+btoa(name1.innerHTML+"-"+name2.innerHTML);
}

setInterval(()=>{
let p=document.createElement("div");
p.className="petal";
p.innerHTML="✦";
p.style.left=Math.random()*100+"%";
document.body.appendChild(p);
setTimeout(()=>p.remove(),10000);
},500);

setInterval(()=>{
let p=document.createElement("div");
p.className="particle";
p.style.left=Math.random()*100+"%";
document.body.appendChild(p);
setTimeout(()=>p.remove(),8000);
},300);

</script>
</body>
</html>
